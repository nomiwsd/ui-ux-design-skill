name: Publish latest main

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: true

jobs:
  publish:
    name: Test, version, and publish
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Confirm this is still the latest main commit
        id: current
        shell: bash
        run: |
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"

          if [[ "${REMOTE_SHA}" != "${SOURCE_SHA}" ]]; then
            echo "A newer main commit exists; its CI run will publish instead."
            echo "release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "release=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node.js
        if: steps.current.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm Trusted Publishing requires npm >= 11.5.1 and Node.js >= 22.14.0.
      # Pinning npm prevents runner image changes from silently breaking OIDC.
      - name: Install OIDC-compatible npm
        if: steps.current.outputs.release == 'true'
        run: npm install --global npm@11.6.2

      - name: Verify publishing prerequisites
        if: steps.current.outputs.release == 'true'
        shell: bash
        run: |
          REGISTRY="$(npm config get registry)"
          echo "Node.js $(node --version)"
          echo "npm $(npm --version)"
          echo "Registry: ${REGISTRY}"

          if [[ "${REGISTRY}" != "https://registry.npmjs.org/" ]]; then
            echo "::error::Unexpected npm registry: ${REGISTRY}"
            exit 1
          fi

          if [[ "${HAS_NPM_TOKEN}" != "true" ]]; then
            if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ||
                  -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
              echo "::error::GitHub OIDC is unavailable and NPM_TOKEN is not configured."
              exit 1
            fi
          fi

      - name: Install dependencies
        if: steps.current.outputs.release == 'true'
        run: npm ci

      - name: Run tests
        if: steps.current.outputs.release == 'true'
        run: npm test

      - name: Calculate the next npm version
        if: steps.current.outputs.release == 'true'
        id: version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          REPO_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}" version 2>/dev/null || echo "0.0.0")"

          NEXT_VERSION="$(
            node - "${REPO_VERSION}" "${PUBLISHED_VERSION}" <<'NODE'
          const [repoVersion, publishedVersion] = process.argv.slice(2);

          function parse(version) {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match) {
              throw new Error("Expected a stable semantic version, received: " + version);
            }
            return match.slice(1).map(Number);
          }

          function compare(left, right) {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          }

          const repo = parse(repoVersion);
          const published = parse(publishedVersion);
          const next =
            compare(repo, published) > 0
              ? repo
              : [published[0], published[1], published[2] + 1];

          process.stdout.write(next.join("."));
          NODE
          )"

          echo "Repository version: ${REPO_VERSION}"
          echo "Published version:  ${PUBLISHED_VERSION}"
          echo "Release version:    ${NEXT_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/v${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${NEXT_VERSION} already exists."
            exit 1
          fi

          npm version "${NEXT_VERSION}" --no-git-tag-version --allow-same-version
          echo "value=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify release package
        if: steps.current.outputs.release == 'true'
        run: npm pack --dry-run

      - name: Recheck main before publishing
        if: steps.current.outputs.release == 'true'
        shell: bash
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "${SOURCE_SHA}" ]]; then
            echo "::error::main advanced while this release was being prepared; stopping before npm publish."
            exit 1
          fi

      - name: Publish with repository token
        if: steps.current.outputs.release == 'true' && env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with npm trusted publishing
        if: steps.current.outputs.release == 'true' && env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public --provenance

      - name: Commit version, tag, and push
        if: steps.current.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): v${VERSION} [skip ci]"
          fi

          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: steps.current.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v${VERSION}" --generate-notes --verify-tag
